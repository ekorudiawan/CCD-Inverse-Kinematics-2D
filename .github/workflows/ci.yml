name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install package
        run: pip install -e .
      - name: Run tests
        run: |
          python -c "from ccd_ik.kinematics import FK, IK; import numpy as np; links = [50, 40, 35, 30]; angles = [0.0, 0.0, 0.0, 0.0]; result = IK(np.array([80.0, 40.0, 0.0]), angles, links); assert result.solved; assert result.error < 0.1; print(f'IK OK: iter={result.iterations}, err={result.error:.4f}')"
